<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Casa em Paz — Organização do Casal sem Sobrecarga</title>
    
    <!-- Meta tags PWA & SEO -->
    <meta name="description" content="Divisão equilibrada e justa das tarefas domésticas para casais, baseada em tempo disponível e desgaste real. Evite sobrecarga com harmonia e leveza." />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Casa em Paz" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts modernas: Plus Jakarta Sans e Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Desativa e limpa Service Worker no aplicativo móvel para evitar cache preso e tela branca
      if ('serviceWorker' in navigator) {
        const isApp = window.location.protocol === 'capacitor:' || 
                      window.location.hostname === 'localhost' || 
                      window.Capacitor;
        if (isApp) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let reg of registrations) {
              reg.unregister();
            }
          }).catch(() => {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
